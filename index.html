<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Большая стройка</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#951b81;--navy:#12284a;--mut:#5b6b85;--grad:linear-gradient(100deg,#831F82,#C7017F 60%,#E30613);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#f4f5f9;color:var(--navy);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{background:#fff;padding:14px 12px 12px;text-align:center;border-bottom:4px solid;border-image:var(--grad) 1}
header img{height:30px;width:auto;display:block;margin:0 auto 10px}
h1{margin:0;font-size:24px;font-weight:700}
.city{color:var(--mut);font-size:13px;margin-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);padding:10px 12px;border-bottom:1px solid #e3e6ee}
.bar input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--navy);font:inherit;font-size:16px;outline:none}
.bar input:focus{box-shadow:0 0 0 4px #951b8133}
#res{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;color:var(--mut);padding:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
#wrap{margin:0 8px;height:70vh;overflow:auto;border-radius:18px;border:2px solid #cfd2d8;background:#6fae5b}
#map{padding:16px;width:1836px;zoom:.45;background:#6fae5b}
.grid{position:relative;display:grid;grid-template-columns:repeat(11,124px);grid-template-rows:430px 430px 645px;gap:44px;background:radial-gradient(circle at 18% 30%,#6a6d77 0,transparent 35%),radial-gradient(circle at 72% 68%,#656872 0,transparent 40%),radial-gradient(circle at 45% 90%,#555862 0,transparent 30%),repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),#5b5e68}
.dist{position:relative;min-width:0;background:radial-gradient(circle at 20% 15%,#9bd67e,transparent 40%),radial-gradient(circle at 80% 85%,#5fa84f,transparent 45%),#7cc266;border:5px solid #d6d8de;border-radius:18px;padding:44px 6px 6px;display:grid;justify-items:center;align-items:end;align-content:space-evenly;box-shadow:0 0 0 3px #b8bcc6,0 0 0 7px #5b5e68,0 0 0 9px #ecebe4}
.dist::before{content:attr(data-t);position:absolute;top:8px;left:14px;font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#7a1a6b;background:#fff;padding:3px 12px;border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.dist[data-t="Район оформления"]::before{left:50%;transform:translateX(-50%)}
.st{background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px) center/100% 3px no-repeat,#5b5e68;height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#f1f1f1;border-top:4px solid #d6d8de;border-bottom:4px solid #d6d8de}
.st span{background:#5b5e68;padding:0 12px}
.park{position:relative;min-width:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-evenly;align-content:space-evenly;padding:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 22px,transparent 22px 44px),radial-gradient(circle at 30% 20%,#e3f9c6,transparent 55%),radial-gradient(circle at 78% 82%,#cdf0a6,transparent 55%),#b6e68a;border:5px solid #d6d8de;border-radius:18px;box-shadow:0 0 0 3px #b8bcc6,0 0 0 7px #5b5e68,0 0 0 9px #ecebe4}
.grid>.cell{position:absolute;z-index:5}
.cell{width:90px;height:196px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;transition:.2s}
.cell:hover{transform:translateY(-5px)}
.cell svg{overflow:visible;display:block}.c0 svg{filter:drop-shadow(0 0 4px #ff7ac0)}.c1 svg{filter:drop-shadow(0 0 6px #a86bf0)}.c2 svg{filter:drop-shadow(0 0 8px #ff4f9e)}.c3 svg{filter:drop-shadow(0 0 12px #ff4fd8)}
.nm{position:relative;z-index:6;font-size:11px;font-weight:600;line-height:1.1;text-align:center;margin-top:3px;height:27px;width:92px;color:#3a2430;background:rgba(255,255,255,.93);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:600;background:#c0267a;color:#fff;padding:2px 9px;border-radius:9px;z-index:7;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#mayor{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;padding-bottom:12px;background:repeating-linear-gradient(0deg,#d9ceb6 0 2px,transparent 2px 40px),repeating-linear-gradient(90deg,#d9ceb6 0 2px,transparent 2px 40px),#ece3cf;border:5px solid #d6d8de;border-radius:18px;box-shadow:0 0 0 3px #b8bcc6,0 0 0 7px #5b5e68,0 0 0 9px #ecebe4}
#mayor svg{overflow:visible}
.mn{font-size:15px;text-align:center;margin-top:8px;color:#3a2430;background:#fff;border-radius:10px;padding:4px 14px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.dim{opacity:.25}.hit{animation:p 1s infinite;z-index:6}
@keyframes p{50%{transform:scale(1.35);filter:drop-shadow(0 0 10px #ffd400)}}
.zm{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:8}
.zm button{width:46px;height:46px;border-radius:14px;border:0;background:var(--grad);color:#fff;font-size:24px;font-weight:700;box-shadow:0 4px 12px #0003}
#m{position:fixed;inset:0;background:rgba(18,40,74,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#m.s{display:flex}
.card{background:#fff;color:var(--navy);border-top:6px solid var(--ink);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 40px #0004}
.card h3{margin:0 0 4px;font-size:20px}
.card .k{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;margin:6px 0 12px}
.card p{margin:6px 0;font-size:15px}
.card button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-weight:600;font-size:15px}
@media(min-width:900px){header{display:flex;align-items:center;justify-content:center;gap:24px;padding:16px 32px}header img{height:38px;margin:0}h1{font-size:28px}.city{margin:0}.bar{display:flex;align-items:center;gap:16px;padding:12px 32px;justify-content:center}.bar input{width:460px;flex:none}#res{margin-top:0;flex:1;max-width:900px}.legend{font-size:13px;gap:6px 22px;padding:12px 32px}#wrap{margin:0 24px 24px;height:calc(100vh - 250px);min-height:520px;cursor:grab}#wrap:active{cursor:grabbing}.zm{right:40px;bottom:40px}}
</style></head><body>
